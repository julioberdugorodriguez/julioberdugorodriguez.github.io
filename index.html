<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe557">
<title>Mollete · Instrucciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #ffe557;      /* fondo del logo */
    --amarillo: #fcdc35;   /* fondo de la caja */
    --verde: #6b972d;      /* "Diseñado y fabricado en Andalucía" */
    --verde-oscuro: #4f7420;
    --cielo: #bbe3fa;
    --tomate: #e94c3b;
    --tomate-oscuro: #b8352a;
    --fresa: #d26477;
    --texto: #3d3417;
    --ancho-logo: min(75vw, 420px);                        /* el logo ocupa el 75% del ancho */
    --alto-barra: calc(var(--ancho-logo) * 202 / 760 + 24px); /* alto del logo + 12px arriba y abajo */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Fredoka", system-ui, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    /* hueco para la franja fija (más la muesca del móvil, si la hay) */
    padding: calc(var(--alto-barra) + env(safe-area-inset-top) + 16px) 16px 28px;
  }
  .contenedor { max-width: 560px; margin: 0 auto; text-align: center; }

  /* Franja fija superior con el logo */
  .barra {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    height: calc(var(--alto-barra) + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    background: var(--fondo);
    box-shadow: 0 4px 0 var(--amarillo);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo {
    width: var(--ancho-logo);
    height: auto;
    display: block;
  }

  /* Tarjetas */
  .tarjeta {
    background: #fff;
    border-radius: 24px;
    padding: 22px 18px;
    margin-top: 22px;
    box-shadow: 0 6px 0 var(--amarillo);
  }
  .tarjeta.cielo { background: var(--cielo); }
  h2 {
    font-weight: 700;
    font-size: 24px;
    color: var(--verde-oscuro);
    margin-bottom: 14px;
  }

  .boton {
    display: block;
    background: var(--tomate);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 21px;
    padding: 18px 16px;
    border-radius: 16px;
    box-shadow: 0 5px 0 var(--tomate-oscuro);
    transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .boton:hover { background: #f05a49; }
  .boton:active { transform: translateY(5px); box-shadow: 0 0 0 var(--tomate-oscuro); }
  .enlace-ver {
    display: inline-block;
    margin-top: 14px;
    color: var(--verde);
    font-weight: 600;
    font-size: 16px;
  }

  .video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    border: 4px solid #fff;
  }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .tarjeta:first-child { margin-top: 0; }

  /* Ilustración de ingredientes al final (su fondo es el mismo amarillo de la página) */
  .ingredientes {
    display: block;
    width: 100%;
    height: auto;
    margin-top: 22px;
  }

</style>
</head>
